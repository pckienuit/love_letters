<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Heart of Stars ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style/style.css">
</head>
<body>
  <div class="cosmic-bg"></div>
  <div class="aurora"></div>
  <div class="floating-hearts"></div>
  <canvas id="canvas"></canvas>
  
  <div class="message">
    <div class="main-text">
      <span class="word">I</span>
      <span class="word">love</span>
      <span class="word">you</span>
      <span class="word">in</span>
      <span class="word">every</span>
      <span class="word">universe</span>
      <span class="heart-emoji">💖</span>
    </div>
    <div class="subtitle">
      <span class="glow-text">Anh yêu em...Cho dù ở vũ trụ nào anh vẫn yêu em</span>
    </div>
  </div>
  
  <div class="click-hint">
    <span class="pulse-text">✨ Click anywhere to start the magic ✨</span>
  </div>
  
  <audio id="bg-music" loop>
    <source src="./assets/audio/Nom - Beneath The Rain - EquinoxVibe.mp3" type="audio/mpeg">
  </audio>  
  <script src="./script/script.js"></script>
</body>
</html>
